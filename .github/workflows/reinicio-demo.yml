name: Reinicio diario de la demo

# Restaura los datos de demo cada día (03:30 UTC ≈ 05:30 en Madrid en invierno, 04:30 en verano).
# También mantiene activo el proyecto de Supabase del plan gratuito.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  reiniciar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/demo/reset
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/demo/reset")
          echo "Respuesta: $codigo"
          test "$codigo" = "200"
